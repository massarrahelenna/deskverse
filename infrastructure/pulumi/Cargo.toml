[package]
name    = "deskverse-infra"
version = "0.1.0"
edition = "2021"

# Pulumi Rust SDK — https://github.com/pulumi/pulumi-rust
[dependencies]
pulumi_wasm_rust          = { version = "0.1" }
pulumi_wasm_aws_ecr       = { version = "0.1" }
pulumi_wasm_aws_ecs       = { version = "0.1" }
pulumi_wasm_aws_ec2       = { version = "0.1" }
pulumi_wasm_aws_iam       = { version = "0.1" }
pulumi_wasm_aws_lb        = { version = "0.1" }
pulumi_wasm_aws_s3        = { version = "0.1" }
pulumi_wasm_aws_cloudfront = { version = "0.1" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
